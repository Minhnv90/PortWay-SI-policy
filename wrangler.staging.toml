name = "portway-si-staging"
main = "worker.js"
compatibility_date = "2026-11-21"

[vars]
ALLOWED_ORIGINS = "https://minhnv90.github.io,https://portwaysix5564.pinet.com"
AI_MODEL = "@cf/google/gemma-4-26b-a4b-it"


[ai]
binding = "AI"


# STAGING-ONLY config. The Worker name differs from production.
# Staging test: do not enable scheduled triggers until ingestion is reviewed.
# Intended future schedule: 0 */6 * * * (every 360 minutes UTC).
# [triggers]
# crons = ["0 */6 * * *"]

# Provision a new isolated D1 database and replace the placeholder before enabling.
[[d1_databases]]
binding = "KNOWLEDGE_DB"
database_name = "portway-si-staging"
database_id = "63a484b4-ab0f-4f9f-a299-78fca28f6755"
