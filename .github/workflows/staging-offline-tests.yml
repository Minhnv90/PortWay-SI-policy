name: Staging offline smoke tests
on:
  push:
    branches: [staging-config]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Worker JavaScript syntax
        run: node --check worker.js
      - name: Run isolated mock smoke tests
        run: node --test tests/*.test.mjs
